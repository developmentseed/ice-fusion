site_name: FUSION
site_description: Score ice-sheet model ensembles against satellite observations.
repo_url: https://github.com/developmentseed/ice-fusion
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - content.code.annotate
    - content.tooltips

markdown_extensions:
  - abbr
  - admonition
  - pymdownx.details
  - pymdownx.snippets:
      base_path: .
      check_paths: true
      auto_append:
        - includes/abbreviations.md
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          # External inventories so cross-references like [`pm.sample`][pymc.sample]
          # resolve to upstream docs and survive their URL changes. Requires network
          # at build time (the objects.inv files are fetched and cached).
          inventories:
            - https://docs.python.org/3/objects.inv
            - https://www.pymc.io/projects/docs/en/stable/objects.inv
            - https://docs.pydantic.dev/latest/objects.inv
            - https://numpy.org/doc/stable/objects.inv
            - https://docs.xarray.dev/en/stable/objects.inv
          options:
            show_source: false
            show_root_heading: true
            members_order: source

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Interpreting results: interpreting-results.md
  - Config reference: config-reference.md
  - Terminology: terminology.md
  - Examples:
      - Basic run: examples/basic.md
  - Validation: validation.md
  - API reference: api/fusion.md
  - Development:
    - Contributing: contributing.md
    - Data upload: data-upload.md

