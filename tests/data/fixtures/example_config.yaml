ensemble:
  path: /path/to/psuism/runs/
  adapter: psuism
observations:
  source: source-coop
  version: "2025.04"
grid:
  target: obs_8km
  method: conservative
regions:
  source: imbie_basins
metric:
  type: pixelwise_gaussian
inference:
  stream_weights:
    thick: 1.5
    vel: 1.5
  subsample:
    size: 20000
    seed: 42
  draws: 500
  tune: 1000
  chains: 4
  target_accept: 0.95
projection:
  target_year: 2100
  quantity: grounded_ice_volume
