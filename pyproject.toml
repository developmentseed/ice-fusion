[project]
name = "ice-fusion"
dynamic = ["version"]
description = "Score ice-sheet model ensembles against satellite observations and weight projections by historical skill."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "FUSION contributors" }]
dependencies = [
    "numpy>=1.26",
    "xarray>=2024.1",
    "netCDF4>=1.6",
    "pandas>=2.2",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "xopr>=0.1",
    "pymc>=5.10",
    "arviz>=0.17,<1.0",  # pymc 5 still expects the 0.x API surface
    "matplotlib>=3.8",
    "obstore>=0.9.4",
    "obspec-utils>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.3",
    "mypy>=1.8",
    "types-PyYAML>=6.0",
    "pandas-stubs>=2.0",
]
docs = [
    # mkdocs 2.0 will be backward-incompatible; pin the 1.x / 9.x line until
    # we explicitly migrate.
    "mkdocs>=1.6,<2.0",
    "mkdocs-material>=9.5,<10.0",
    "mkdocstrings[python]>=0.24,<1.0",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
# Without any git tags, hatch-vcs falls back to this — keeps editable
# installs working before we cut the first v0.1.0 / v1.0.0 tag.
fallback-version = "0.0.0"

[tool.hatch.build.hooks.vcs]
version-file = "src/fusion/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/fusion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: end-to-end tests that exercise the PyMC sampler",
]
filterwarnings = [
    # Cython 3 + numpy 2.x opaque-struct check; benign, see Cython #6065.
    "ignore:numpy.ndarray size changed:RuntimeWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# validation/baseline/full_model.py is a pinned upstream copy of Sara's
# full_model.py; style issues there reflect upstream, not this project.
# The refresh procedure (see validation/baseline/README.md) re-applies our
# small documented patches; running ruff over the file would force
# unrelated cosmetic rewrites that drift from upstream and complicate
# refreshes.
extend-exclude = ["validation/baseline/full_model.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
# Ban Any written in our own annotations (strict alone does not). Implicit Any
# flowing in from untyped scientific libs is handled at the boundary, not banned.
disallow_any_explicit = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "validation/compare.py"]
# validation/baseline/full_model.py is a pinned upstream copy (see ruff note).
exclude = "validation/baseline/"

# Third-party libraries that ship no type information (verified: no py.typed).
# Listed explicitly rather than via a blanket ignore_missing_imports so a new
# untyped dependency surfaces as an error and gets a deliberate entry here.
# numpy, xarray, matplotlib, arviz, obstore, obspec_utils ship types; pandas
# types come from the pandas-stubs dev dependency.
[[tool.mypy.overrides]]
module = [
    "pymc.*",
    "xopr.*",
    "geopandas.*",
]
ignore_missing_imports = true

# Pinned upstream copy; imported by validation/compare.py so `exclude` alone
# does not stop mypy following it. Reported errors reflect upstream, not us.
[[tool.mypy.overrides]]
module = ["validation.baseline.*"]
ignore_errors = true

# The pydantic.mypy plugin synthesizes model constructors that contain Any
# (e.g. `**data: Any`), so disallow_any_explicit flags our model class lines for
# Any we never wrote. Our own annotations in this schema module are concrete.
[[tool.mypy.overrides]]
module = ["fusion.config"]
disallow_any_explicit = false

# The validation harness bridges the typed package to the *untyped* pinned
# baseline (validation/baseline/full_model.py): the oracle's functions are
# untyped and its data dict values are Any. Relax only the two checks that
# police that boundary; the rest of strict (return/param annotations, no bare
# generics) still applies, and the real interfaces (PreparedData, traces) are
# typed normally.
[[tool.mypy.overrides]]
module = ["validation.compare"]
disallow_any_explicit = false
disallow_untyped_calls = false
