[project]
name = "ice-fusion"
dynamic = ["version"]
description = "Score ice-sheet model ensembles against satellite observations and weight projections by historical skill."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "FUSION contributors" }]
dependencies = [
    "numpy>=1.26",
    "xarray>=2024.1",
    "netCDF4>=1.6",
    "pandas>=2.2",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "xopr>=0.1",
    "pymc>=5.10",
    "arviz>=0.17,<1.0",  # pymc 5 still expects the 0.x API surface
    "matplotlib>=3.8",
    "obstore>=0.9.4",
    "obspec-utils>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.3",
    "mypy>=1.8",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.24",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
# Without any git tags, hatch-vcs falls back to this — keeps editable
# installs working before we cut the first v0.1.0 / v1.0.0 tag.
fallback-version = "0.0.0"

[tool.hatch.build.hooks.vcs]
version-file = "src/fusion/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/fusion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: end-to-end tests that exercise the PyMC sampler",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
