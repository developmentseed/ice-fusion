[project]
name = "ice-fusion"
version = "0.1.0"
description = "Score ice-sheet model ensembles against satellite observations and weight projections by historical skill."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "FUSION contributors" }]
dependencies = [
    "numpy>=1.26",
    "xarray>=2024.1",
    "netCDF4>=1.6",
    "pandas>=2.2",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "xarray-regrid>=0.2",
    "xopr>=0.1",
    "pymc>=5.10",
    "arviz>=0.17",
    "matplotlib>=3.8",
    "fsspec>=2024.2",
    "s3fs>=2024.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.3",
    "mypy>=1.8",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fusion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
